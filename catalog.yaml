# basecast data catalog
# ERCOT entries: extracted verbatim from docs/ercot-data-catalog.md (research pass, Sep 2026).
# Non-ERCOT entries at the bottom were added for basecast; their `verified` fields say what was checked.
# Each entry's `verified` field says how far it was checked. Never trust an unverified URL, ID or column name.

- id: gis_report
  name: "GIS Report (Generator Interconnection Status)"
  source_url: "https://www.ercot.com/mp/data-products/data-product-details?id=pg7-200-er"
  api_endpoint: "product page listing (no login): reportListUrl misapp/servlets/IceDocListJsonWS?reportTypeId=15933 + reportDownloadUrl misdownload/servlets/mirDownload?doclookupId=<DocID>, both declared in the page script (verified 2026-09-25). Public API archive not needed; not tested"
  format: xlsx
  frequency: monthly
  spatial_grain: project (INR), county
  temporal_grain: monthly snapshot
  history_start: "listing: 2019-04 onward (99 GIS_Report files as of 2026-09-25); Resource Adequacy year pages 2014-2018 link 60 older monthly workbooks back to 2014-05"
  access: "no login on ercot.com; Public API (registration, 30 req/min, 1000 files/download, US-only)"
  gridstatus_method: "Ercot().get_interconnection_queue()"
  priority: P0
  used_by: [generation_survival_model, supply_overlay, county_map]
  caveats: "header row varies (scan for 'INR'); INR duplicated across sheets; small-gen detail only since 2022-01; PG7-201-ER cost file is a separate report type (27292); the 15933 listing also carries Co-located_Battery_Identification_Report files (since 2020-11); legacy mis.ercot.com GetReports.do needs a client certificate; milestone header names not verified"
  verified: "verified at source 2026-09-25 (listing, IDs, cadence, downloads); columns partially verified"

