# Official figures that have no tabular file. Loaded into `official_forecasts` (and large-load headlines)
# with method=manual. Values first came from docs/SCRAPING_RUNBOOK.md §9 and docs/ercot-data-catalog.md;
# on 2026-09-26 each one was checked against the source document in our raw lake (quote searched in the
# document text; `page` says where). `verified: true` means the number and wording match that document.
#
# Fields: category (load_forecast | large_load | peak_record), metric, target (year or season the number
# refers to), as_of (date of the underlying data), mw, approx (true when the source says "approximately"),
# source (document), source_date (publication/filing date), source_url, page, verified, notes.

figures:
