# Public facts about Base Power Company (basepowercompany.com): utility partners and areas served.
# Manual config, not a pipeline. One item per fact, only what the source literally says (no inference):
# fact, entity as written, source URL (fetched), source date, source type (primary = Base's site or
# press release, news, filing), a short verbatim quote, verified: false until a human re-reads it.
# Collected 2026-09-26 by a research pass: every URL fetched and every quote matched against the page
# text; a 5-fact sample was re-checked independently the same day (5/5 matched). Business Wire blocked
# fetching, so some press releases cite mirror copies (noted in comments).
#
# Gaps: no public source describes a partnership with Oncor, CenterPoint, AEP Texas or TNMP (Base lists
# them only as retail delivery areas); entry dates for the AEP Texas and TNMP areas were not found.

