# Weather points per ERCOT weather zone, for open_meteo (ERA5 hourly) and the weather-normalized load model.
#
# Cities: Figure 1 of ERCOT's 2025 Long-Term Load Forecast report (2025_LTLF_Report.docx, "ERCOT weather
# zones"), which marks the reference cities of each zone. The report says each zone uses "two or three
# weather stations" but does not name them in text, so the exact ERCOT station list is NOT verified.
# Coordinates: each city's primary airport, from NOAA ISD station history (isd-history.csv, fetched
# 2026-09-25). The airport choice per city is ours (e.g. Houston = IAH, not HOU).
# Weights: equal within each zone (our choice; ERCOT's own weights are not published in the report).
# ERA5's grid is ~0.25°, so the exact point inside a city barely matters.

points:
  - {id: coast_houston_iah, weather_zone: COAST, city: Houston, icao: KIAH, latitude: 29.984, longitude: -95.361, weight: 1.0}
