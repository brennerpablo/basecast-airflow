monthly_nov_2025_p8:
  report_date: 2025-11-01
  text: |
    Large Load Interconnection Requests Update
    As of November 18, 2025, ERCOT is tracking approximately 226,000 MW of large loads seeking
    interconnection to the system. For reference, in December 2024, there were 63,000 MW of
    Large Load interconnection requests. Approximately 128,000 MW of the 226,000 MW have
    not yet submitted their Planning Studies for review. A Large Load is considered any load of 75
    MW or greater at a single point of interconnection.
    As of now, approximately 7,500 MW of Large Loads have been approved to energize, with
    5,300 MW having been observed energized and an additional 2,200 MW having been
    approved to energize, but not yet operational.

monthly_apr_2026_p4:
  report_date: 2026-04-01
  text: |
    The Large Load Interconnection Queue continues to grow, with applications of large loads
    now totaling 445.8 gigawatts (GW) by 2033. Of these current applications, 321 GW of these
    applications have No Studies Submitted yet to ERCOT. 93.7 GW of Large Load applications
    are classified as Under ERCOT Review, and 22 GW having Section 9.5 Requirements Met.
    ERCOT has 5.9 GW of Observed Energized Large Loads, with another 3.2 GW of loads that
    have Approval to Energize but are not Operational.

batch_zero_sep_2026_p1:
  report_date: 2026-09-14
  text: |
    Item 14: Batch Zero Update
    Key Takeaways
    • ERCOT has provided conditional classification for
    all Batch Zero Large Loads:
    • 204 projects (66.4 GW) met the qualifications to be
    conditionally included as base load;
    • 158 projects (127.9 GW) met the qualifications to
    be conditionally included as studied load.

