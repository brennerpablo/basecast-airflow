march_2026_updated_p6:
  report_date: 2026-03-26
  text: |
    Loads Approved to Energize – Observations 1
    Of the 9,042 MW that have received Approval to Energize, ERCOT has observed a non-simultaneous monthly peak consumption of 4,004 MW in March 2026 which is a slight decrease since February 2026.
    This is calculated as the sum of the maximum value for each individual load per month
    This value represents how much approved load ERCOT believes is now operational

march_2026_updated_p7:
  report_date: 2026-03-26
  text: |
    Loads Approved to Energize – Observations 2
    ERCOT has observed a simultaneous monthly peak consumption of 3,522 MW in March 2026 which is a slight decrease since February 2026.
    This is the maximum value of the sum of all the individual loads per month
    This value is the maximum amount of large load that ERCOT has had to serve at a single point in time

